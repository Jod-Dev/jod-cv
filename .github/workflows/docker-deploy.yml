name: Docker Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: docker build -t jod-portfolio .
      
    - name: Test the build
      run: |
        docker create --name test-build jod-portfolio
        docker start test-build
        sleep 10
        docker stop test-build
        docker rm test-build
        
    - name: Push to Container Registry (optional)
      if: github.ref == 'refs/heads/main'
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker tag jod-portfolio ${{ secrets.DOCKER_USERNAME }}/jod-portfolio:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/jod-portfolio:latest
