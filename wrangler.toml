name = "jod-cv"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"
publish = "out"

[build.environment]
NODE_VERSION = "18"

# Configurar dominio personalizado
[env.production]
name = "jod-cv"
route = "jod-cv.pages.dev/*"

# Configurar alias para URL limpia
[[env.production.routes]]
pattern = "jod-cv.pages.dev/*"
zone_name = "pages.dev"
